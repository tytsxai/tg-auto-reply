[project]
name = "tg-auto-reply"
version = "1.0.5"
description = "AI消息托管机器人 - Telegram 自动回复"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0",
    "telethon>=1.36.0",
    "openai>=1.0.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.19.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "black", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
