[project]
name = "tg-auto-reply"
version = "1.0.6"
description = "Self-hosted Telegram AI auto-reply / message hosting — Telethon user session, OpenAI-compatible models, Fernet-encrypted credentials"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "tytsxai" }]
keywords = [
    "telegram",
    "bot",
    "auto-reply",
    "AI",
    "telethon",
    "message-hosting",
    "openai-compatible",
    "self-hosted",
    "自动回复",
    "消息托管",
]
dependencies = [
    "python-telegram-bot>=21.0",
    "telethon>=1.36.0",
    "openai>=2.0.0,<3.0.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.19.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/tytsxai/tg-auto-reply"
Repository = "https://github.com/tytsxai/tg-auto-reply"
Documentation = "https://github.com/tytsxai/tg-auto-reply/tree/main/docs"
Changelog = "https://github.com/tytsxai/tg-auto-reply/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "black", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
