services:
  tg-auto-reply:
    build: .
    container_name: tg-auto-reply
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENABLE_HTTP_HEALTHCHECK=1
      - HEALTHCHECK_HOST=0.0.0.0
      - HEALTHCHECK_PORT=8080
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
