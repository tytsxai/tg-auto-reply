services:
  tg-auto-reply:
    build: .
    container_name: tg-auto-reply
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENABLE_HTTP_HEALTHCHECK=1
      - HEALTHCHECK_HOST=0.0.0.0
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
